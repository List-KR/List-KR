name: AGLint and ESLint

on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - "**"

jobs:
    lint:
        name: Run AGLint
        runs-on: ubuntu-latest
        steps:
            -   name: Check out to repository
                uses: actions/checkout@v7

            -   name: Set up Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: lts/*

            -   name: Install dependencies
                run: npm install

            -   name: Run AGLint
                run: npm run lint:aglint
