name: Publish and Deploy

on:
    push:
        branches: [ master ]
        paths:
            - "filterslists/**"
            - "src/**"
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - tsconfig.json
    workflow_dispatch:

concurrency:
    group: publish-and-deploy
    cancel-in-progress: false

jobs:
    lint:
        name: Run AGLint
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: Check out to repository
                uses: actions/checkout@v7

            -   name: Set up pnpm
                uses: pnpm/setup@v2
                with:
                    runtime: node@24
                    cache: true

            -   name: Run AGLint
                run: pnpm run lint

            -   name: Run tests
                run: pnpm test

    build:
        name: Build and Publish to npm
        needs: lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            -   name: Check out to repository
                uses: actions/checkout@v7

            -   name: Set up pnpm
                uses: pnpm/setup@v2
                with:
                    runtime: node@24
                    cache: true

            -   name: Build
                run: pnpm run build

            -   name: Set up Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: 24

            -   name: Publish to npm
                run: npm publish

    purge:
        name: Purge jsdelivr cache
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: read
            contents: read
        steps:
            -   name: Set up Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: lts/*

            -   name: Check out to repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Purge jsDelivr cache
                uses: List-KR/jsdelivr-purge@7.0.0
                continue-on-error: true
